name: Update submodules

on:
  repository_dispatch:
    types: [submodule-update]
  workflow_dispatch:

# The branch push and the pull request use a token from the release bot GitHub
# App, the same one release-please uses, not GITHUB_TOKEN. With GITHUB_TOKEN the
# PR was opened and pushed by github-actions[bot], and every `build` run on it
# ended as `action_required`: held for a manual approval that the next dispatch
# made stale again. Pushes made with the App token trigger `build` like any
# other push, so the PR gets its required check on its own. See issue #75. The
# App replaced the RELEASE_PLEASE_TOKEN PAT: it does not expire and does not act
# as a person.
#
# GITHUB_TOKEN itself needs no write access any more.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Update all submodules to latest
        # --remote without --merge resets each submodule to its remote tip
        # (default 'checkout' update mode). The .website repo never commits
        # inside submodule trees, so there's nothing to preserve via merge —
        # using --merge fails with 'unrelated histories' if any upstream
        # repo rewrites its history (force-pushed feature branches, etc.).
        run: git submodule update --remote --recursive

      # main requires a reviewed pull request, so the update is proposed rather
      # than pushed. The action no-ops when no submodule moved, and reuses the
      # same branch when one is already open, so repeated dispatches collapse
      # into a single pull request instead of piling up.
      - name: Propose the update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update submodules"
          branch: chore/update-submodules
          delete-branch: true
          title: "chore: update submodules"
          body: |
            Submodules moved to their remote tips.

            Raised automatically by the `Update submodules` workflow, which runs
            when a library repository reports a change under `docs/`.
