name: Update submodules

on:
  repository_dispatch:
    types: [submodule-update]
  workflow_dispatch:

# GITHUB_TOKEN defaults to read-only for this org, so without these the push
# below fails with a 403 and the dispatch is silently lost.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update all submodules to latest
        # --remote without --merge resets each submodule to its remote tip
        # (default 'checkout' update mode). The .website repo never commits
        # inside submodule trees, so there's nothing to preserve via merge —
        # using --merge fails with 'unrelated histories' if any upstream
        # repo rewrites its history (force-pushed feature branches, etc.).
        run: git submodule update --remote --recursive

      # main requires a reviewed pull request, so the update is proposed rather
      # than pushed. The action no-ops when no submodule moved, and reuses the
      # same branch when one is already open, so repeated dispatches collapse
      # into a single pull request instead of piling up.
      - name: Propose the update
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update submodules"
          branch: chore/update-submodules
          delete-branch: true
          title: "chore: update submodules"
          body: |
            Submodules moved to their remote tips.

            Raised automatically by the `Update submodules` workflow, which runs
            when a library repository reports a change under `docs/`.
